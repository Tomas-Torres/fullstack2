<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Carrito</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    
    <header class="d-flex justify-content-between align-items-center px-4 py-3 header-tienda">
        <div class="logo d-flex align-items-center">
            <img src="./assets/img/logo_Lv_Up.webp" alt="Logo Level-Up Gamer" width="40">
            <span class="ms-2">Level-Up Gamer</span>
        </div>

        <nav>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="acciones-usuario d-flex align-items-center gap-3">
            <a href="login.html" class="text-white">Iniciar sesión</a>
            <a href="registro.html" class="text-white">Registrar usuario</a>
            <a href="carrito.html" class="btn btn-outline-light btn-sm">
                carrito (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <main class="px-4 py-5">
        <h1 class="mb-4">Mi carrito de compras</h1>

        <div class="row g-4">
            
            <div class="col-12 col-md-8">
                <div id="lista-carrito">
                    
                </div>
            </div>

            
            <div class="col-12 col-md-4">
                <div class="resumen-carrito">
                    <p class="d-flex justify-content-between">
                        <span>Total:</span>
                        <strong id="total-carrito">$0 CLP</strong>
                    </p>

                    <div class="campo-formulario">
                        <label for="cupon">Cupón de descuento</label>
                        <div class="d-flex gap-2">
                            <input type="text" id="cupon" placeholder="Ingresa tu cupón">
                            <button id="btn-aplicar-cupon" class="btn btn-outline-light">Aplicar</button>
                        </div>
                        <span class="error" id="error-cupon"></span>
                    </div>

                    <button id="btn-pagar" class="btn btn-morado w-100 mt-3">Pagar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/carrito-comun.js"></script>
    <script src="./assets/js/carrito.js"></script>
</body>
</html>
