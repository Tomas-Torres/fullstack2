<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <!-- HEADER: idéntico al de las otras páginas -->
    <header class="d-flex justify-content-between align-items-center px-4 py-3 header-tienda">
        <div class="logo d-flex align-items-center">
            <img src="./assets/img/logo_Lv_Up.webp" alt="Logo Level-Up Gamer" width="40">
            <span class="ms-2">Level-Up Gamer</span>
        </div>

        <nav>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
            </ul>
        </nav>

        <div class="acciones-usuario d-flex align-items-center gap-3">
            <a href="login.html" class="text-white">Iniciar sesión</a>
            <a href="registro.html" class="text-white">Registrar usuario</a>
            <a href="carrito.html" class="btn btn-outline-light btn-sm">
                carrito (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <main class="d-flex flex-column align-items-center py-5 px-3">

        <!-- Logo y nombre de la empresa, según pide el wireframe de esta vista -->
        <img src="./assets/img/logo_Lv_Up.webp" alt="Logo Level-Up Gamer" width="80" class="mb-3">
        <h1 class="mb-4">Level-Up Gamer</h1>

                <form id="form-login" class="formulario-tienda" novalidate>
            <h2 class="text-center mb-4">Inicio de sesión</h2>

            <div class="campo-formulario">
                <label for="login-correo">Correo</label>
                <input type="email" id="login-correo" name="correo" placeholder="Ej: nombre@correo.com">
                <span class="error" id="error-login-correo"></span>
            </div>

            <div class="campo-formulario">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password" placeholder="Tu contraseña">
                <span class="error" id="error-login-password"></span>
            </div>

            <button type="submit" class="btn btn-morado w-100 mt-3">Iniciar sesión</button>
        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/login.js"></script>
    <script src="./assets/js/carrito-comun.js"></script>
    
</body>
</html>
