server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion para reducir el peso del bundle en la red.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router: cualquier ruta desconocida vuelve al index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre se pueden cachear por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
